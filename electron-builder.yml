appId: com.feng.revival
productName: Revival
copyright: Copyright © 2026 feng
directories:
  output: release
win:
  target: nsis
  icon: public/icon.ico
  publisherName: feng
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Revival
mac:
  target: dmg
  icon: public/icon.icns
  category: public.app-category.photography
linux:
  target: AppImage
  icon: public/icon.png
  category: Photography
publish:
  provider: generic
  url: https://releases.example.com
fileAssociations:
  - ext: jpg
    name: JPEG Image
    mimeType: image/jpeg
  - ext: jpeg
    name: JPEG Image
    mimeType: image/jpeg
  - ext: png
    name: PNG Image
    mimeType: image/png
  - ext: heic
    name: HEIC Image
    mimeType: image/heic
  - ext: webp
    name: WebP Image
    mimeType: image/webp
